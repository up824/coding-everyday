<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>写字岛</title>
<meta name="description" content="用 Apple Pencil 练习写数字和英文字母的闯关小游戏">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="写字岛">
<meta name="theme-color" content="#E4F3FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* 布局：一屏应用。顶部状态条 + 可滚动主区；练字页是「提示栏 + 写字板」，竖屏或窄屏时提示栏叠到写字板上方、工具按钮落到下方。
   视觉：晴天底色上的白色练习本，四线三格（红色基线）贯穿各处；只做这一套明亮主题，孩子的写字纸不跟随深色模式。 */
:root {
  color-scheme: light;
  --sky: #E4F3FF;          /* 页面底色 */
  --sky-deep: #CBE6FF;
  --card: #FFFFFF;
  --soft: #F1F6FC;         /* 卡片里的浅底 */
  --ink: #1D2B4F;          /* 主文字，也是默认墨水 */
  --ink-2: #56678C;        /* 次要文字 */
  --line: #D0E1F3;         /* 描边、按钮底边 */
  --mute: #BFCDE0;         /* 未解锁、未点亮 */
  --mute-deep: #A3B4CB;
  --sun: #FFC533;          /* 星星 */
  --sun-deep: #D98C00;
  --sun-soft: #FFF2CC;
  --gold: #F2A400;         /* 句子岛 */
  --coral: #FF6B57;        /* 数字岛、基线 */
  --coral-deep: #D64835;
  --sea: #2B8CFF;          /* 大写岛、主色 */
  --sea-deep: #1766CC;
  --grape: #8257F5;        /* 小写岛 */
  --grape-deep: #5F37CC;
  --leaf: #1FAE70;         /* 写对了、起笔点 */
  --leaf-deep: #14845A;
  --gem: #12B8CC;          /* 宝石、算术岛 */
  --gem-deep: #0B8797;
  --rose: #E5486A;         /* 提醒 */
  --rose-deep: #B32E4C;
  --warn-bg: #FFF0D2;
  --on-accent: #FFFFFF;
  --shade: rgba(29, 43, 79, .18);
  --veil: rgba(20, 32, 64, .46);
  --accent: var(--sea);
  --accent-deep: var(--sea-deep);
  --f-display: "ZCOOL KuaiLe", "Fredoka", ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-body: ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "Fredoka", ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  --r: 22px;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--sky) linear-gradient(var(--sky), var(--sky-deep)) fixed;
  color: var(--ink); font: 16px/1.45 var(--f-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: pan-x pan-y; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

.app {
  height: 100%; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column;
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.scroll { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 14px; }

.w-num { --accent: var(--coral); --accent-deep: var(--coral-deep); }
.w-upper { --accent: var(--sea); --accent-deep: var(--sea-deep); }
.w-lower { --accent: var(--grape); --accent-deep: var(--grape-deep); }

/* ---------- 图标、星星、字形 ---------- */
.ic { width: 24px; height: 24px; fill: currentColor; flex: none; pointer-events: none; }
.ic.on { fill: var(--sun); stroke: var(--sun-deep); stroke-width: 1.2; }
.ic.off { fill: var(--line); }
.stars { display: inline-flex; gap: 2px; }
.stars .ic { width: 22px; height: 22px; }
.stars-s .ic { width: 15px; height: 15px; }
.gl { display: block; height: 64px; width: auto; overflow: visible; pointer-events: none; }
.gl path { fill: none; stroke: currentColor; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
.gl circle { fill: currentColor; }
.gl-rule line { stroke: currentColor; stroke-width: 2; opacity: .32; }
.gl-rule .mid { stroke-dasharray: 7 6; }
.gl-rule .base { opacity: .75; }

/* ---------- 顶部条 ---------- */
.topbar { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.top-title { font: 28px/1.1 var(--f-display); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 42px; padding: 0 13px 0 9px; border-radius: 21px; background: var(--card); font: 600 19px/1 var(--f-num); box-shadow: 0 3px 0 var(--line); font-variant-numeric: tabular-nums; }
.chip small { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.chip-gem .ic { fill: var(--gem); }
.chip-fire .ic { fill: var(--coral); }
.chip.bump { animation: bump .45s; }
.ibtn { width: 48px; height: 48px; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: 0 3px 0 var(--line); flex: none; }
.ibtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

/* ---------- 按钮 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 20px; border-radius: 18px; font: 21px/1 var(--f-display); background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--line); white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn-soft { background: var(--card); }
.btn-go { background: var(--leaf); color: var(--on-accent); box-shadow: 0 4px 0 var(--leaf-deep); }
.btn-go:active { box-shadow: 0 1px 0 var(--leaf-deep); }
.btn-danger { background: var(--rose); color: var(--on-accent); box-shadow: 0 4px 0 var(--rose-deep); }
.bar { display: block; height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.seg { display: inline-flex; background: var(--card); border-radius: 16px; padding: 4px; gap: 4px; box-shadow: 0 3px 0 var(--line); }
.seg button { min-height: 44px; padding: 0 16px; border-radius: 12px; font: 18px/1 var(--f-display); color: var(--ink-2); white-space: nowrap; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.card { background: var(--card); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h3 { font: 22px/1.2 var(--f-display); }
.hint-line { color: var(--ink-2); font-size: 14px; padding: 10px 2px 0; }
.empty { color: var(--ink-2); }

/* ---------- 首页 ---------- */
.me { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 26px; padding: 4px 16px 4px 6px; box-shadow: 0 3px 0 var(--line); min-width: 0; }
.me-face { font-size: 34px; line-height: 44px; width: 44px; text-align: center; }
.me-info { display: flex; flex-direction: column; gap: 5px; min-width: 0; text-align: left; }
.me-title { font: 17px/1 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-row { display: flex; align-items: center; gap: 8px; }
.me-score { font: 500 13px/1 var(--f-num); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar-xp { width: 96px; max-width: 100%; height: 8px; flex: none; }
.bar-xp i { background: var(--sun); }
.home-main { display: flex; flex-direction: column; gap: 16px; }
.hero { padding: 6px 2px 0; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.hero h1 { font: 46px/1.05 var(--f-display); letter-spacing: .04em; }
.hero p { color: var(--ink-2); font-size: 18px; }
.font-btn { margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: 10px; background: var(--card); border-radius: 18px; padding: 6px 8px 6px 14px; box-shadow: 0 3px 0 var(--line); text-align: left; }
.font-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.font-btn .gl { height: 36px; }
.font-btn-text { display: flex; flex-direction: column; gap: 3px; }
.font-btn small { font-size: 12px; line-height: 1; color: var(--ink-2); }
.font-btn b { font: 18px/1 var(--f-display); font-weight: 400; white-space: nowrap; }
.font-btn .ic { width: 20px; height: 20px; color: var(--ink-2); }
.islands { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
.island { grid-column: span 2; }
.island.island-wide { grid-column: span 2; flex-direction: row; align-items: stretch; }
.island.island-wide .island-art { flex: none; width: 44%; display: flex; align-items: center; padding: 12px; }
.island.island-wide .island-info { flex: 1; min-width: 0; justify-content: center; }
.w-word { --accent: var(--leaf); --accent-deep: var(--leaf-deep); }
.w-sent { --accent: var(--gold); --accent-deep: var(--sun-deep); }
.w-math { --accent: var(--gem); --accent-deep: var(--gem-deep); }
.island { display: flex; flex-direction: column; text-align: left; background: var(--card); border-radius: 26px; overflow: hidden; box-shadow: 0 6px 0 var(--accent-deep); min-width: 0; }
.island:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-deep); }
.island-art { display: block; padding: 14px 12px 8px; background: var(--accent); color: var(--on-accent); overflow: hidden; }
.island-art .gl { width: 100%; height: auto; }
.island-info { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; }
.island-name { font: 26px/1.1 var(--f-display); }
.island-meta { color: var(--ink-2); font-size: 15px; }
.island-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.island-stars { display: inline-flex; align-items: center; gap: 4px; font: 500 16px/1 var(--f-num); color: var(--ink-2); }
.island-stars b { color: var(--ink); font-weight: 600; }
.island-stars .ic { width: 20px; height: 20px; }
.island-go { display: inline-flex; align-items: center; gap: 2px; padding: 8px 10px 8px 16px; border-radius: 16px; background: var(--accent); color: var(--on-accent); font: 19px/1 var(--f-display); }
.island-go .ic { width: 20px; height: 20px; }
.home-row { display: grid; grid-template-columns: minmax(0, 1.7fr) repeat(3, minmax(0, 1fr)); gap: 12px; }
.goal { position: relative; display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: var(--r); padding: 12px 16px; min-width: 0; }
.ring { width: 68px; height: 68px; flex: none; }
.ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.ring-bg { stroke: var(--soft); }
.ring-fg { stroke: var(--leaf); }
.goal-num { position: absolute; left: 16px; width: 68px; text-align: center; font: 500 14px/1 var(--f-num); color: var(--ink-2); }
.goal-num b { font-size: 20px; font-weight: 600; color: var(--ink); }
.goal-text { display: flex; flex-direction: column; min-width: 0; }
.goal-text b { font: 20px/1.2 var(--f-display); font-weight: 400; }
.goal-text span { color: var(--ink-2); font-size: 14px; }
.nav { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--card); border-radius: var(--r); padding: 12px; font: 20px/1.1 var(--f-display); box-shadow: 0 4px 0 var(--line); min-width: 0; }
.nav:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.nav .ic { width: 40px; height: 40px; padding: 8px; border-radius: 14px; color: var(--on-accent); }
.n-pick .ic { background: var(--sea); }
.n-prog .ic { background: var(--leaf); }
.n-shop .ic { background: var(--gem); }

/* ---------- 关卡地图 ---------- */
.map-scroll { display: flex; flex-direction: column; }
.track { position: relative; flex: none; margin-block: auto; }
.map-tip { flex: none; text-align: center; color: var(--ink-2); font-size: 15px; padding: 8px 0 2px; }
.track-path { position: absolute; inset: 0; width: 100%; height: 100%; }
.track-path path { fill: none; stroke: var(--card); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 26; }
.node { position: absolute; transform: translateX(-50%); width: 136px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.node-ball { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font: 700 40px/1 var(--f-num); box-shadow: 0 6px 0 var(--accent-deep), 0 0 0 6px var(--card); }
.node-ball .ic { width: 40px; height: 40px; }
.node:active .node-ball { transform: translateY(3px); box-shadow: 0 3px 0 var(--accent-deep), 0 0 0 6px var(--card); }
.node.boss .node-ball { background: var(--sun); color: var(--ink); box-shadow: 0 6px 0 var(--sun-deep), 0 0 0 6px var(--card); }
.node.locked .node-ball { background: var(--mute); box-shadow: 0 6px 0 var(--mute-deep), 0 0 0 6px var(--card); }
.node.next .node-ball { animation: bob 1.5s ease-in-out infinite; }
.node .stars { margin-top: 6px; }
.node-label { font: 600 17px/1.3 var(--f-num); letter-spacing: .1em; color: var(--ink-2); background: var(--card); padding: 2px 12px; border-radius: 12px; }
.node-label.node-title { font: 16px/1.35 var(--f-display); letter-spacing: 0; text-align: center; }
.node.boss .node-label { font-family: var(--f-display); font-weight: 400; letter-spacing: 0; }

/* ---------- 练字 ---------- */
.pips { flex: 1; min-width: 0; display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
.pip { width: 24px; height: 10px; border-radius: 5px; background: var(--card); }
.pip.cur { box-shadow: 0 0 0 3px var(--sea); }
.pip.s1 { background: var(--mute); }
.pip.s2 { background: var(--sun-soft); box-shadow: inset 0 0 0 2px var(--sun); }
.pip.s3 { background: var(--sun); }
.pip.cur.s1, .pip.cur.s2, .pip.cur.s3 { box-shadow: 0 0 0 3px var(--sea); }
.pip-text { font: 500 18px/1 var(--f-num); color: var(--ink-2); }
.pip-text b { color: var(--ink); font-weight: 600; font-size: 22px; }

.play-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 14px; }
.hand-left .play-body { grid-template-columns: minmax(0, 1fr) 250px; }
.hand-left .side { order: 2; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.prompt { position: relative; background: var(--card); border-radius: var(--r); padding: 12px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; overflow: hidden; }
.mode-tag { align-self: flex-start; font: 17px/1 var(--f-display); padding: 6px 12px; border-radius: 12px; color: var(--on-accent); background: var(--sea); }
.mode-tag[data-mode="dots"] { background: var(--grape); }
.mode-tag[data-mode="write"] { background: var(--coral); }
.model { display: flex; justify-content: center; width: 100%; padding: 4px 0; color: var(--ink); }
.model .gl { height: 150px; }
.model .gl-lower { height: 202px; }
.is-text .model .gl { width: 100%; height: auto; max-height: min(46vh, 330px); }
.is-text .prompt-text { font: 17px/1.35 var(--f-body); color: var(--ink-2); text-align: center; white-space: normal; }
.model .gl-rule line { stroke: var(--sea); }
.model .gl-rule .base { stroke: var(--coral); opacity: .9; }
.prompt-text { font: 22px/1.2 var(--f-display); }
.ibtn-speak { position: absolute; top: 8px; right: 8px; background: var(--soft); box-shadow: none; }
.buddy { display: flex; align-items: flex-end; gap: 6px; min-width: 0; }
.buddy-face { font-size: 50px; line-height: 1; flex: none; }
.bubble { flex: 1; min-width: 0; background: var(--card); border-radius: 18px 18px 18px 5px; padding: 10px 14px; font-size: 17px; line-height: 1.35; }
.bubble.warn { background: var(--warn-bg); }
.bubble.pop { animation: pop .28s; }
.tools { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tools .btn { padding: 0 10px; }
.tools .btn-go { grid-column: 1 / -1; min-height: 66px; font-size: 25px; }

.board-wrap { position: relative; min-width: 0; min-height: 0; border-radius: 26px; overflow: hidden; box-shadow: 0 6px 0 var(--line); }
.board-wrap.shake { animation: shake .32s; }
/* 单词、句子写完后，成绩条不盖住最后一行：写字板让出成绩条的高度 */
.board-wrap.lift .board { bottom: var(--banner-h, 0px); }
.board {
  --b-paper: #FFFFFF; --b-line: #A9CDF2; --b-base: #FF8474; --b-road: #E4EBF6; --b-dash: #9FB0CC;
  --b-fill: #FFE08A; --b-fill-a: 1; --b-ink: #22335C; --b-wrong: #F4A0B0; --b-start: #1FAE70; --b-next: #9FB0CC;
  --b-demo: #2B8CFF; --b-ghost: rgba(43, 140, 255, .22); --b-bad: #E5486A;
  position: absolute; inset: 0; background: var(--b-paper); touch-action: none; cursor: crosshair;
}
.board[data-skin="mint"] { --b-paper: #EAF6E1; --b-line: #9CCB9A; --b-base: #F08A6C; --b-road: #D3E7C8; --b-dash: #86A886; --b-next: #86A886; }
.board[data-skin="chalk"] {
  --b-paper: #22463F; --b-line: rgba(255, 255, 255, .42); --b-base: #FFAE9C; --b-road: rgba(255, 255, 255, .15); --b-dash: rgba(255, 255, 255, .58);
  --b-fill: #FFD666; --b-fill-a: .45; --b-ink: #FBFBF2; --b-wrong: #FF9BAE; --b-start: #57D9A0; --b-next: rgba(255, 255, 255, .5);
  --b-demo: #7CC4FF; --b-ghost: rgba(124, 196, 255, .35); --b-bad: #FF8FA3;
}
.board[data-skin="night"] {
  --b-paper: #121A3E; --b-line: rgba(160, 190, 255, .42); --b-base: #FF9A8A; --b-road: rgba(160, 190, 255, .17); --b-dash: rgba(190, 210, 255, .62);
  --b-fill: #FFD666; --b-fill-a: .5; --b-ink: #F3F6FF; --b-wrong: #FF9BAE; --b-start: #57D9A0; --b-next: rgba(190, 210, 255, .55);
  --b-demo: #7CC4FF; --b-ghost: rgba(124, 196, 255, .35); --b-bad: #FF8FA3;
  background-image: radial-gradient(#FFFFFF 1px, transparent 1.6px), radial-gradient(rgba(255, 255, 255, .6) 1px, transparent 1.4px);
  background-size: 130px 110px, 90px 150px; background-position: 20px 30px, 60px 80px;
}
.board > svg, .board > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.b-line { stroke: var(--b-line); stroke-width: 2; }
.b-line.l-mid { stroke-dasharray: 10 8; }
.b-line.l-base { stroke: var(--b-base); stroke-width: 3; }
.b-slant { stroke: var(--b-line); stroke-width: 1.5; opacity: .42; }
.b-slot { stroke: var(--b-dash); stroke-width: 5; stroke-linecap: round; }
.b-slot.ok { stroke: var(--b-start); }
.b-slot.bad { stroke: var(--b-bad); }
.g-road, .g-ghost { fill: none; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
.g-road { stroke: var(--b-road); }
.g-ghost { stroke: var(--b-ghost); }
.g-road-dot { fill: var(--b-road); }
.g-fixed { fill: none; stroke: var(--b-dash); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.g-fixed-dot { fill: var(--b-dash); }
.b-fillcv { opacity: var(--b-fill-a, 1); }
.board.drawing .fx-pulse { display: none; }
.g-ghost-dot { fill: var(--b-ghost); }
.g-dash { fill: none; stroke: var(--b-dash); stroke-width: 1.4; stroke-dasharray: 3.5 3.5; stroke-linecap: round; stroke-linejoin: round; }
.g-dots { fill: none; stroke: var(--b-dash); stroke-width: 3; stroke-dasharray: .1 7; stroke-linecap: round; stroke-linejoin: round; }
.g-dots-dot { fill: none; stroke: var(--b-dash); stroke-width: 2.4; stroke-dasharray: .1 5.4; stroke-linecap: round; }
.b-fx text { text-anchor: middle; font-family: var(--f-num); font-weight: 700; fill: var(--on-accent); }
.fx-dot { fill: var(--b-start); }
.fx-pulse { fill: var(--b-start); opacity: .4; transform-box: fill-box; transform-origin: center; animation: pulse 1.25s ease-out infinite; }
.fx-next circle { fill: var(--b-next); }
.fx-arrow { fill: none; stroke: var(--b-start); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
.demo-path { fill: none; stroke: var(--b-demo); stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
.demo-dot { fill: var(--b-demo); }
.demo-pen { fill: var(--b-demo); stroke: var(--card); stroke-width: 2.2; }

.input-chip { position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 12px; border-radius: 18px; background: var(--card); color: var(--ink-2); font-size: 14px; box-shadow: 0 2px 8px var(--shade); }
.input-chip .ic { width: 18px; height: 18px; }
.hand-left .input-chip { right: auto; left: 12px; }
.banner { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; background: var(--card); border-radius: 22px; padding: 12px 14px 12px 18px; box-shadow: 0 10px 28px var(--shade); animation: rise .3s; }
.banner-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
.banner-stars { display: flex; gap: 2px; flex: none; }
.banner-stars .ic { width: 46px; height: 46px; }
.banner-text { display: flex; flex-direction: column; min-width: 0; }
.banner-text b { font: 24px/1.2 var(--f-display); font-weight: 400; }
.banner-text span { color: var(--ink-2); font-size: 15px; }
.banner-rw { display: flex; gap: 8px; flex-wrap: wrap; }
.rw { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 14px; background: var(--soft); font: 600 18px/1 var(--f-num); }
.rw-gem .ic { fill: var(--gem); width: 20px; height: 20px; }
.rw-combo { background: var(--sun-soft); font-family: var(--f-display); font-weight: 400; }
.banner-act { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.banner-act .btn-soft { background: var(--soft); box-shadow: 0 4px 0 var(--line); }
.btn.auto { position: relative; overflow: hidden; }
.btn.auto::after { content: ""; position: absolute; left: 0; bottom: 0; height: 6px; width: 100%; background: var(--on-accent); opacity: .55; transform-origin: left; animation: countdown 2.8s linear forwards; }
.ic.pop0, .ic.pop1, .ic.pop2 { animation: starpop .4s backwards; }
.ic.pop0 { animation-delay: .15s; } .ic.pop1 { animation-delay: .35s; } .ic.pop2 { animation-delay: .55s; }

/* ---------- 自由练习 ---------- */
.pick-bar { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.seg-mode button.on { background: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 12px; padding: 2px 2px 6px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px 10px; border-radius: 20px; background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--line); }

.tile .gl { height: 84px; }
.tile.st1 { background: var(--card) linear-gradient(to top, var(--soft) 34%, transparent 34%); }
.tile.st2 { background: var(--card) linear-gradient(to top, var(--soft) 67%, transparent 67%); }
.tile.st3 { background: var(--soft); box-shadow: 0 4px 0 var(--accent); }
.tiles-word { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tile-word { gap: 4px; padding: 12px 10px 10px; }
.zh { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.sents { display: flex; flex-direction: column; gap: 10px; padding: 2px 2px 6px; }
.sent { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 12px 16px; border-radius: 18px; background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--line); text-align: left; }
.sent:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.sent .zh { grid-column: 1; }
.sent .stars { grid-column: 2; grid-row: 1 / span 2; }
.sent.st1 { background: var(--card) linear-gradient(to right, var(--soft) 34%, transparent 34%); }
.sent.st2 { background: var(--card) linear-gradient(to right, var(--soft) 67%, transparent 67%); }
.sent.st3 { background: var(--soft); box-shadow: 0 4px 0 var(--accent); }
.card .tiles, .card .sents { padding: 0; }
.card .tile, .card .sent { background-color: var(--soft); box-shadow: none; }
.card .tile.st1, .card .sent.st1 { background: #CFE4FF; }
.card .tile.st2, .card .sent.st2 { background: #8FC0FF; }
.card .tile.st3, .card .sent.st3 { background: var(--sea); color: var(--on-accent); }
.card .st3 .zh { color: var(--on-accent); }

/* ---------- 成长记录 ---------- */
.pg { display: flex; flex-direction: column; gap: 14px; }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--card); border-radius: 18px; padding: 12px 16px; min-width: 0; }
.stat b { display: block; font: 600 32px/1.15 var(--f-num); font-variant-numeric: tabular-nums; }
.stat small { font-size: 16px; font-weight: 500; color: var(--ink-2); }
.stat span { color: var(--ink-2); font-size: 14px; }
.chart { position: relative; height: 190px; }
.bars { position: absolute; inset: 24px 0 0 0; display: flex; }
.bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.bar-box { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; border-bottom: 2px solid var(--line); padding: 0 1px; }
.bar-box i { position: relative; display: block; width: min(32px, 62%); background: var(--sea); border-radius: 4px 4px 0 0; }
.bar-box em { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); padding-bottom: 3px; font: 600 15px/1 var(--f-num); font-style: normal; color: var(--ink); }
.bar-x { height: 26px; line-height: 26px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.bar-col.today .bar-x { color: var(--ink); font-weight: 700; }
.bar-col:hover .bar-box i, .bar-col.sel .bar-box i { background: var(--sea-deep); }
.bar-col.sel .bar-x { color: var(--sea-deep); font-weight: 700; }
.goal-line { position: absolute; left: 0; right: 0; bottom: calc(26px + 140px * var(--g)); border-top: 2px dashed var(--mute); pointer-events: none; }
.goal-line span { position: absolute; right: 0; bottom: 3px; font-size: 12px; color: var(--ink-2); background: var(--card); padding-left: 6px; }
.chart-note { color: var(--ink-2); font-size: 14px; min-height: 1.45em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .cell { width: 16px; height: 16px; border-radius: 5px; padding: 0; }
.pg-group { display: flex; flex-direction: column; gap: 6px; }
.pg-group h4 { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.cell { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; padding: 6px; background: var(--soft); color: var(--ink-2); }
.cell .gl { height: 100%; max-width: 100%; }
.cell.st1 { background: #CFE4FF; color: var(--ink); }
.cell.st2 { background: #8FC0FF; color: var(--ink); }
.cell.st3 { background: var(--sea); color: var(--on-accent); }
.weak { display: flex; flex-wrap: wrap; gap: 10px; }
.weak-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; border-radius: 16px; background: var(--soft); color: var(--ink); font: 600 15px/1.2 var(--f-num); }
.weak-item .gl { height: 54px; }
.weak-item span { color: var(--ink-2); }
.card > .btn { align-self: flex-start; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.badge { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--soft); color: var(--ink-2); }
.badge .ic { grid-row: 1 / span 2; width: 34px; height: 34px; fill: var(--mute); }
.badge b { font-size: 16px; }
.badge span { font-size: 13px; }
.badge.got { background: var(--sun-soft); color: var(--ink); }
.badge.got .ic { fill: var(--sun-deep); }
.sync-line { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink-2); font-size: 13px; text-align: center; }
.sync-line .ic { width: 18px; height: 18px; }

/* ---------- 商店 ---------- */
.shop-main { display: flex; flex-direction: column; gap: 14px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 12px; }
.shop-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 10px; border-radius: 18px; background: var(--soft); border: 3px solid transparent; min-width: 0; }
.shop-item.using { border-color: var(--leaf); background: var(--card); }
.shop-item b { font: 18px/1.2 var(--f-display); font-weight: 400; }
.pen-prev { width: 100%; height: 56px; }
.board-prev { position: relative !important; inset: auto !important; display: block; width: 100%; height: 56px; border-radius: 12px; overflow: hidden; cursor: inherit; }
.board-prev i { position: absolute; left: 0; right: 0; height: 2px; background: var(--b-line); }
.board-prev i:nth-child(1) { top: 20%; } .board-prev i:nth-child(2) { top: 42%; opacity: .6; }
.board-prev i:nth-child(3) { top: 64%; background: var(--b-base); } .board-prev i:nth-child(4) { top: 86%; }
.buddy-prev { font-size: 46px; line-height: 56px; }
.shop-btn { display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 14px; border-radius: 18px; font: 600 17px/1 var(--f-num); }
.shop-btn .ic { width: 18px; height: 18px; }
.shop-btn.price { background: var(--card); box-shadow: 0 2px 0 var(--line); }
.shop-btn.price .ic { fill: var(--gem); }
.shop-btn.price.poor { color: var(--ink-2); }
.shop-btn.own { background: var(--sea); color: var(--on-accent); font-family: var(--f-display); font-weight: 400; }
.shop-btn.using { color: var(--leaf-deep); font-family: var(--f-display); font-weight: 400; }

/* ---------- 弹窗 ---------- */
.modal-root {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal-back { position: absolute; inset: 0; background: var(--veil); cursor: pointer; }
.modal { position: relative; background: var(--card); border-radius: 28px; padding: 22px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; animation: rise .28s; }
.modal-x { position: absolute; top: 14px; right: 14px; background: var(--soft); box-shadow: none; }
.modal h3 { font: 26px/1.2 var(--f-display); }
.result { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.result-face { font-size: 72px; line-height: 1; }
.result h2 { font: 34px/1.15 var(--f-display); }
.result-stars { display: flex; gap: 4px; }
.result-stars .ic { width: 68px; height: 68px; }
.result-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.result-stats div { background: var(--soft); border-radius: 16px; padding: 10px 6px; }
.result-stats b { display: block; font: 600 26px/1.2 var(--f-num); }
.result-stats span { font-size: 13px; color: var(--ink-2); }
.result-para { width: 100%; background: var(--soft); border-radius: 16px; padding: 12px 14px; color: var(--ink); }
.result-para .gl { width: 100%; height: auto; }
.result-para p { color: var(--ink-2); font-size: 14px; padding-top: 6px; text-align: left; }
.result-act { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding-top: 4px; }
.result-act .btn-soft, .ask-act .btn-soft, .reset-ask .btn-soft, .opt-reset > .btn-soft { background: var(--soft); }
.ask { display: flex; flex-direction: column; gap: 10px; }
.ask p { color: var(--ink-2); }
.ask-act { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 6px; }
.settings { display: flex; flex-direction: column; }
.settings h3 { padding-bottom: 10px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.opt-name { min-width: 0; flex: 1 1 150px; }
.opt-name b { display: block; font-size: 17px; }
.opt-name span { font-size: 13px; color: var(--ink-2); }
.opt .seg { box-shadow: none; background: var(--soft); }
.opt .seg button { min-height: 40px; padding: 0 13px; font-size: 16px; }
.reset-ask { display: flex; gap: 8px; flex-wrap: wrap; }
.modal-fonts { width: min(720px, 100%); }
.fonts { display: flex; flex-direction: column; gap: 12px; }
.fonts-note { color: var(--ink-2); font-size: 14px; padding-right: 52px; }
.font-list { display: flex; flex-direction: column; gap: 12px; }
.font-card { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 10px 14px 10px 10px; border-radius: 20px; background: var(--soft); border: 3px solid transparent; text-align: left; }
.font-card.on { border-color: var(--leaf); background: var(--card); }
.font-sample { display: block; background: var(--card); border-radius: 14px; overflow: hidden; padding: 8px 10px; color: var(--ink); }
.font-card.on .font-sample { background: var(--soft); }
.font-sample .gl { width: 100%; height: auto; }
.font-sample .gl-rule line { stroke: var(--sea); }
.font-sample .gl-rule .base { stroke: var(--coral); opacity: .9; }
.font-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.font-meta b { font: 24px/1.1 var(--f-display); font-weight: 400; }
.font-meta span { font-size: 14px; color: var(--ink-2); }
.font-pick { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 14px; border-radius: 20px; background: var(--sea); color: var(--on-accent); font: 17px/1 var(--f-display); white-space: nowrap; }
.font-card.on .font-pick { background: none; color: var(--leaf-deep); padding: 0 4px; }
.font-pick .ic { width: 20px; height: 20px; }
.info { display: flex; flex-direction: column; gap: 14px; }
.info-head { display: flex; align-items: center; gap: 16px; padding-right: 52px; }
.info-glyph { background: var(--soft); border-radius: 18px; padding: 10px 14px; }
.info-glyph .gl { height: 88px; }
.info-head p { color: var(--ink-2); }
.info-modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.info-mode { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 16px; background: var(--soft); }
.info-mode b { font: 19px/1.1 var(--f-display); font-weight: 400; }
.info-mode span:last-child { font-size: 13px; color: var(--sea-deep); font-weight: 700; }
.spark { width: 100%; max-width: 280px; height: auto; display: block; }
.spark polyline { fill: none; stroke: var(--sea); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spark circle { fill: var(--sea); stroke: var(--card); stroke-width: 2; }
.spark-base { stroke: var(--line); stroke-width: 1; }
.spark-cap { font-size: 13px; color: var(--ink-2); }

/* ---------- 提示条、彩纸 ---------- */
.toasts { position: fixed; z-index: 60; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.toast { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 10px 18px; border-radius: 20px; background: var(--ink); color: var(--on-accent); font-size: 16px; box-shadow: 0 8px 22px var(--shade); animation: drop .28s; transition: opacity .35s; }
.toast.good { background: var(--leaf-deep); }
.toast.out { opacity: 0; }
.toast .ic { width: 20px; height: 20px; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 70; pointer-events: none; }

/* ---------- 动画 ---------- */
@keyframes pop { from { transform: scale(.92); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { from { transform: scale(1); opacity: .45; } to { transform: scale(2.1); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: none; } 50% { transform: translateY(-7px); } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
@keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes bump { 0%, 100% { transform: none; } 40% { transform: scale(1.18); } }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- 竖屏、窄屏 ---------- */
@media (max-width: 860px), (orientation: portrait) {
  .play-body, .hand-left .play-body { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "prompt buddy" "board board" "tools tools"; gap: 10px; }
  .side { display: contents; }
  .prompt { grid-area: prompt; flex-direction: row; align-items: center; gap: 10px; padding: 8px 60px 8px 10px; }
  .prompt .mode-tag { position: absolute; left: 10px; top: 8px; font-size: 14px; padding: 4px 9px; }
  .model { width: auto; padding: 22px 0 0; }
  .model .gl { height: 78px; }
  .model .gl-lower { height: 104px; margin-bottom: -22px; }
  .prompt-text { font-size: 19px; white-space: nowrap; }
  .ibtn-speak { top: 50%; transform: translateY(-50%); }
  .ibtn-speak:active { transform: translateY(calc(-50% + 2px)); }
  .buddy { grid-area: buddy; align-items: center; }
  .buddy-face { font-size: 42px; }
  .board-wrap { grid-area: board; }
  .tools { grid-area: tools; margin-top: 0; grid-template-columns: 1fr 1fr 1.5fr; }
  .tools .btn-go { grid-column: auto; min-height: 56px; font-size: 22px; }
  .tools:has(#btnCheck[hidden]) { grid-template-columns: 1fr 1fr; }
  .tools:has(#btnDemo[hidden]) { grid-template-columns: 1fr 1.5fr; }
  /* 单词、句子：示范要占一整行才看得清，伙伴的话放到它下面 */
  .is-text .play-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "prompt" "buddy" "board" "tools"; }
  .is-text .prompt { flex-direction: column; align-items: stretch; padding: 30px 60px 8px 12px; gap: 2px; }
  .is-text .model { padding: 0; }
  .is-text .model .gl { height: auto; max-height: 150px; margin: 0; }
  .is-text .prompt-text { display: block; text-align: left; font-size: 15px; }
}
@media (max-width: 760px) {
  .islands { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .island, .island.island-wide { grid-column: auto; flex-direction: row; align-items: stretch; }
  .island.island-wide .island-art { width: 132px; padding: 10px 8px; }
  .island-art { flex: none; width: 132px; display: flex; align-items: center; padding: 10px 8px; }
  .island-info { flex: 1; min-width: 0; padding: 12px 14px; gap: 6px; }
  .island-name { font-size: 22px; }
  .home-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .goal { grid-column: 1 / -1; }
  .nav { flex-direction: column; gap: 6px; font-size: 17px; padding: 12px 6px; }
  .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero h1 { font-size: 38px; }
  .hero p { display: none; }
  .font-card { grid-template-columns: minmax(0, 1fr) auto; }
  .font-sample { grid-column: 1 / -1; }
}
@media (max-width: 520px) {
  .bar-xp { width: 56px; }
  .chip { height: 38px; padding: 0 10px 0 7px; font-size: 17px; }
  .chip-fire small { display: none; }
  .ibtn { width: 44px; height: 44px; }
  .top-title { font-size: 23px; }
  .buddy-face { display: none; }
  .bubble { font-size: 15px; padding: 8px 12px; border-radius: 16px; }
  .prompt-text { display: none; }
  .prompt { padding-right: 56px; }
  .banner { padding: 10px 12px; gap: 8px 12px; }
  .banner-stars .ic { width: 34px; height: 34px; }
  .banner-text b { font-size: 20px; }
  .banner-act { width: 100%; margin-left: 0; }
  .banner-act .btn { flex: 1; min-height: 50px; padding: 0 10px; font-size: 19px; }
  .tools .btn { font-size: 18px; min-height: 52px; }
  .seg button { padding: 0 12px; font-size: 16px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
  .tile .gl { height: 64px; }
  .result h2 { font-size: 28px; }
  .result-stars .ic { width: 54px; height: 54px; }
  .modal { padding: 18px; }
  .info-modes { gap: 6px; }
}
</style>

    if (!w) return;
    var i = w.texts.indexOf(text), order = w.texts.slice(i).concat(w.texts.slice(0, i));
    startSession({ kind: 'free', tasks: order.map(function (t) { return { text: t, mode: mode }; }), back: { name: screen.name === 'progress' ? 'progress' : 'pick' } });
  }
  function startFree(ch, mode) {
    var w = Store.world(Gl.kindOf(ch) === 'num' ? 'num' : Gl.kindOf(ch)), i = w.chars.indexOf(ch);
    var order = w.chars.slice(i).concat(w.chars.slice(0, i));
    startSession({ kind: 'free', tasks: order.map(function (c) { return { ch: c, mode: mode }; }), back: { name: screen.name === 'progress' ? 'progress' : 'pick' } });
  }

  /* ================= 成长记录 ================= */
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  function renderProgress() {
    var t = Store.totals(), days = Store.lastDays(7), goal = S().set.goal, streak = Store.streak();
    var max = goal; days.forEach(function (d) { if (d.n > max) max = d.n; });
    max = Math.ceil(max / 4) * 4;
    var peak = 0; days.forEach(function (d) { if (d.n > peak) peak = d.n; });
    var bars = days.map(function (d, i) {
      var label = d.today || (d.n === peak && d.n > 0);
      return '<button class="bar-col' + (d.today ? ' today' : '') + '" data-act="day" data-i="' + i + '" aria-label="' + (d.date.getMonth() + 1) + ' 月 ' + d.date.getDate() + ' 日，练了 ' + d.n + ' 次">' +
        '<span class="bar-box"><i style="height:' + (100 * d.n / max).toFixed(1) + '%">' + (label && d.n ? '<em>' + d.n + '</em>' : '') + '</i></span>' +
        '<span class="bar-x">' + (d.today ? '今天' : '周' + WEEK[d.date.getDay()]) + '</span></button>';
    }).join('');
    var grid = Store.WORLDS.filter(function (w) { return !w.text; }).map(function (w) {
      return '<div class="pg-group"><h4>' + w.name.replace('岛', '') + '</h4><div class="cells">' + w.chars.map(function (ch) {
        var st = Store.stage(ch);
        return '<button class="cell st' + st + '" data-act="char" data-ch="' + ch + '" aria-label="' + kindLabel(ch) + ' ' + ch + '，' + STAGE[st] + '">' + glyphSvg(ch) + '</button>';
      }).join('') + '</div></div>';
    }).join('');
    var weak = Store.weakChars(6);
    var badges = Store.BADGES.map(function (b) {
      var got = !!S().badges[b.id];
      return '<div class="badge' + (got ? ' got' : '') + '">' + icon(got ? 'medal' : 'lock') + '<b>' + b.name + '</b><span>' + b.desc + '</span></div>';
    }).join('');
    app.innerHTML = '<section class="screen progress">' + header('成长记录', 'home') +
      '<div class="scroll pg">' +
      '<div class="stat-row">' +
        '<div class="stat"><b>' + t.learned + '<small> / ' + t.all + '</small></b><span>能自己写的字</span></div>' +
        '<div class="stat"><b>' + t.stars + '<small> / ' + t.maxStars + '</small></b><span>收集的星星</span></div>' +
        '<div class="stat"><b>' + streak + '<small> 天</small></b><span>连续练字</span></div>' +
        '<div class="stat"><b>' + timeHtml(t.sec) + '</b><span>累计练习时间</span></div>' +
      '</div>' +
      '<div class="card chart-card"><h3>最近 7 天练了多少次</h3>' +
        '<div class="chart" style="--g:' + (goal / max).toFixed(3) + '"><div class="goal-line"><span>目标 ' + goal + '</span></div><div class="bars">' + bars + '</div></div>' +
        '<p class="chart-note" id="dayNote">' + dayNote(days[6]) + '</p></div>' +
      '<div class="card"><h3>每个字练到哪一步了</h3>' +
        '<div class="legend">' + [0, 1, 2, 3].map(function (i) { return '<span><i class="cell st' + i + '"></i>' + STAGE[i] + '</span>'; }).join('') + '</div>' + grid +
        '<p class="hint-line">点一个字，看它的详细记录。</p></div>' +
      '<div class="card"><h3>单词和句子</h3>' +
        '<div class="legend">' + [0, 1, 2, 3].map(function (i) { return '<span><i class="cell st' + i + '"></i>' + STAGE[i] + '</span>'; }).join('') + '</div>' +
        Store.WORLDS.filter(function (w) { return w.text; }).map(function (w) {
          var tt = Store.textTotals(w.id);
          return '<div class="pg-group"><h4>' + w.short + '：能自己写 ' + tt.done + ' / ' + tt.all + '</h4>' + textList(w, 'practice-text') + '</div>';
        }).join('') +
        '<p class="hint-line">点一个单词或句子就去练它。</p></div>' +
      '<div class="card"><h3>需要多练的字</h3>' + (weak.length
        ? '<div class="weak">' + weak.map(function (x) { return '<button class="weak-item" data-act="char" data-ch="' + x.ch + '">' + glyphSvg(x.ch) + '<span>' + x.acc + '%</span></button>'; }).join('') + '</div>' +
          '<button class="btn btn-go" data-act="weak">' + icon('pencil') + '<span>专项练习这 ' + weak.length + ' 个字</span></button>'
        : '<p class="empty">' + (t.tried ? '目前没有特别薄弱的字，保持下去。' : '开始练字以后，这里会列出准确度偏低的字。') + '</p>') + '</div>' +
      '<div class="card"><h3>成就</h3><div class="badges">' + badges + '</div></div>' +
      '<p class="sync-line" id="syncLine">' + syncText() + '</p>' +
      '</div></section>';
  }
  var STAGE = ['还没练', '会描红', '会写虚线', '能自己写'];
  function dayNote(d) {
    return (d.date.getMonth() + 1) + ' 月 ' + d.date.getDate() + ' 日（周' + WEEK[d.date.getDay()] + '）：练了 ' + d.n + ' 次，共 ' + fmtTime(d.sec) + '，拿到 ' + d.g + ' 颗宝石';
  }
  function syncText() {
    return Store.syncStatus === 'cloud' ? icon('cloud') + '进度已同步到云端，换设备登录也能接着练' : '进度保存在这台设备的浏览器里';
  }

  function charInfo(ch) {
    var r = Store.rec(ch), acc = Store.avgAcc(ch), a = r.a, spark = '';
    if (a.length > 1) {
      var W = 220, H = 56, pts = a.map(function (v, i) { return [8 + i * (W - 16) / (a.length - 1), 6 + (H - 12) * (1 - v / 100)]; });
      spark = '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="最近 ' + a.length + ' 次的准确度：' + a.join('、') + '">' +
        '<line x1="0" x2="' + W + '" y1="' + (H - 6) + '" y2="' + (H - 6) + '" class="spark-base"/>' +
        '<polyline points="' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>' +
        '<circle cx="' + pts[pts.length - 1][0].toFixed(1) + '" cy="' + pts[pts.length - 1][1].toFixed(1) + '" r="4.5"/></svg>' +
        '<p class="spark-cap">最近 ' + a.length + ' 次准确度，最新一次 ' + a[a.length - 1] + '%</p>';
    }
    openModal('<div class="info"><button class="ibtn modal-x" data-act="modal-close" aria-label="关闭">' + icon('close') + '</button>' +
      '<div class="info-head"><div class="info-glyph">' + glyphSvg(ch) + '</div><div><h3>' + kindLabel(ch) + ' ' + ch + '</h3>' +
      '<p>' + (r.n ? '写过 ' + r.n + ' 次' + (acc !== null ? '，平均准确度 ' + acc + '%' : '') : '还没有练过') + '</p></div></div>' +
      '<div class="info-modes">' + Store.MODES.map(function (m, i) {
        return '<button class="info-mode" data-act="practice" data-ch="' + ch + '" data-id="' + m + '"><b>' + MODE_NAME[m] + '</b>' + starRow(r.s[i], 'stars-s') + '<span>去练习</span></button>';
      }).join('') + '</div>' + spark + '</div>', 'modal-info');
  }

  /* ================= 商店 ================= */
  function penPreview(it, i) {
    var id = 'pg' + i, stops = '';
    if (it.rainbow) for (var k = 0; k <= 6; k++) stops += '<stop offset="' + (k / 6) + '" stop-color="hsl(' + (k * 55) + ',86%,54%)"/>';
    else if (it.stripe) {
      var n = 8;
      for (var j = 0; j < n; j++) {
        var c = it.colors[j % it.colors.length];
        stops += '<stop offset="' + (j / n) + '" stop-color="' + c + '"/><stop offset="' + ((j + 1) / n) + '" stop-color="' + c + '"/>';
      }
    } else it.colors.concat(it.colors.length > 1 ? [it.colors[0]] : []).forEach(function (c, q, arr) {
      stops += '<stop offset="' + (arr.length > 1 ? q / (arr.length - 1) : 0) + '" stop-color="' + c + '"/>';
    });
    return '<svg class="pen-prev" viewBox="0 0 120 56" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" x2="1" y1="0" y2="0">' + stops + '</linearGradient></defs>' +
      '<path d="M10 38 C24 6 40 6 50 30 S76 54 86 26 S104 14 110 22" fill="none" stroke="url(#' + id + ')" stroke-width="7" stroke-linecap="round"/></svg>';
  }
  function renderShop() {
    var st = S();
    function card(type, it, prev) {
      var owned = st.owned[type].indexOf(it.id) >= 0, using = st.use[type] === it.id;
      var btn = using ? '<span class="shop-btn using">' + icon('check') + '使用中</span>'
        : owned ? '<span class="shop-btn own">使用</span>'
        : '<span class="shop-btn price' + (st.gems < it.price ? ' poor' : '') + '">' + icon('gem') + it.price + '</span>';
      return '<button class="shop-item' + (using ? ' using' : '') + '" data-act="shop-item" data-type="' + type + '" data-id="' + it.id + '">' + prev + '<b>' + it.name + '</b>' + btn + '</button>';
    }
    app.innerHTML = '<section class="screen shop">' + header('宝石商店', 'home') +
      '<div class="scroll shop-main">' +
      '<div class="card"><h3>墨水</h3><div class="shop-grid">' + Store.SHOP.pen.map(function (it, i) { return card('pen', it, penPreview(it, i)); }).join('') + '</div></div>' +
      '<div class="card"><h3>写字板</h3><div class="shop-grid">' + Store.SHOP.board.map(function (it) {
        return card('board', it, '<span class="board-prev board" data-skin="' + it.id + '"><i></i><i></i><i></i><i></i></span>');
      }).join('') + '</div></div>' +
      '<div class="card"><h3>伙伴</h3><div class="shop-grid">' + Store.SHOP.buddy.map(function (it) { return card('buddy', it, '<span class="buddy-prev">' + it.face + '</span>'); }).join('') + '</div></div>' +
      '<p class="hint-line">写字拿星星就能得到宝石：一颗星换一颗宝石，过关和完成每日目标还有奖励。</p>' +
      '</div></section>';
  }
  function shopTap(type, id) {
    var st = S(), it = Store.item(type, id);
    if (st.owned[type].indexOf(id) >= 0) { Store.equip(type, id); Sfx.tap(); renderShop(); return; }
    var r = Store.buy(type, id);
    if (r === 'poor') { Sfx.oops(); toast(icon('gem') + '还差 ' + (it.price - st.gems) + ' 颗宝石，再去写几个字吧'); return; }
    Sfx.buy(); confetti(40);
    toast(icon('check') + '「' + it.name + '」到手啦，已经换上', 'good');
    renderShop();
  }

  /* ================= 字体 ================= */
  function setFont(id) {
    Store.setOpt('font', id);
    Gl.setStyle(id);
  }
  function renderFonts() {
    var cur = Gl.style().id;
    openModal('<div class="fonts"><button class="ibtn modal-x" data-act="modal-close" aria-label="关闭">' + icon('close') + '</button><h3>选择字体</h3>' +
      '<p class="fonts-note">字帖、示范动画和所有关卡都会换成选中的字体，已经拿到的星星和宝石不受影响。</p>' +
      '<div class="font-list">' + Gl.STYLES.map(function (st) {
        var on = st.id === cur;
        return '<button class="font-card' + (on ? ' on' : '') + '" data-act="font" data-id="' + st.id + '" aria-pressed="' + on + '">' +
          '<span class="font-sample">' + textSvg('Panda 123', { style: st.id, rule: true }) + '</span>' +
          '<span class="font-meta"><b>' + st.name + '</b><span>' + st.desc + '</span></span>' +
          '<span class="font-pick">' + (on ? icon('check') + '使用中' : '用这个') + '</span></button>';
      }).join('') + '</div></div>', 'modal-fonts');
  }

  /* ================= 设置 ================= */
  var OPTS = [
    { k: 'font', name: '字体', opts: Gl.STYLES.map(function (st) { return [st.id, st.name]; }), note: '字帖和示范用哪种写法' },
    { k: 'sound', name: '音效', opts: [[true, '开'], [false, '关']] },
    { k: 'voice', name: '朗读题目', opts: [['zh', '中文'], ['en', 'English'], ['off', '关']] },
    { k: 'diff', name: '描红判定', opts: [['easy', '宽松'], ['normal', '标准'], ['hard', '严格']], note: '越严格，笔尖离线越近才算对' },
    { k: 'size', name: '字的大小', opts: [['l', '大'], ['m', '中'], ['s', '小']], note: '刚开始用大字，熟练后换小字' },
    { k: 'hand', name: '写字的手', opts: [['right', '右手'], ['left', '左手']], note: '左手会把提示栏换到右边' },
    { k: 'input', name: '用什么写', opts: [['auto', '自动'], ['pen', '只认笔'], ['any', '手指也行']], note: '自动：用过 Apple Pencil 后只认笔尖，防手掌误触' },
    { k: 'goal', name: '每日目标', opts: [[6, '6 次'], [12, '12 次'], [20, '20 次']], note: '写一个字、一个单词或一句话都算一次' }
  ];
  function renderSettings(askReset) {
    var st = S();
    openModal('<div class="settings"><button class="ibtn modal-x" data-act="modal-close" aria-label="关闭">' + icon('close') + '</button><h3>设置</h3>' +
      OPTS.map(function (o) {
        return '<div class="opt"><div class="opt-name"><b>' + o.name + '</b>' + (o.note ? '<span>' + o.note + '</span>' : '') + '</div><div class="seg" role="group" aria-label="' + o.name + '">' +
          o.opts.map(function (v, i) {
            return '<button id="opt-' + o.k + '-' + i + '" class="' + (st.set[o.k] === v[0] ? 'on' : '') + '" aria-pressed="' + (st.set[o.k] === v[0]) + '" data-act="set" data-k="' + o.k + '" data-i="' + i + '">' + v[1] + '</button>';
          }).join('') + '</div></div>';
      }).join('') +
      '<div class="opt opt-reset"><div class="opt-name"><b>重新开始</b><span>清空星星、宝石和所有记录</span></div>' +
      (askReset
        ? '<div class="reset-ask"><button class="btn btn-danger" data-act="reset-yes"><span>确定清空</span></button><button class="btn btn-soft" data-act="settings"><span>不清了</span></button></div>'
        : '<button class="btn btn-soft" data-act="reset-ask"><span>清空进度</span></button>') + '</div></div>', 'modal-settings');
  }

  /* ================= 事件 ================= */
  var acts = {
    'home': function () { go('home'); },
    'world': function (t) { go('map', t.dataset.id); },
    'level': function (t) { startLevel(t.dataset.id); },
    'replay': function (t) { startLevel(t.dataset.id); },
    'to-map': function (t) { go('map', t.dataset.id); },
    'pick': function () { go('pick'); },
    'progress': function () { go('progress'); },
    'shop': function () { go('shop'); },
    'settings': function () { if (play) clearTimeout(play.auto); renderSettings(false); },
    'modal-close': function () {
      var wasSettings = !!modalRoot.querySelector('.modal-settings');
      closeModal();
      if (wasSettings && screen.name === 'play' && play) { play.done ? nextTask() : loadTask(); }   // 设置改了，当前这个字重新来
      else if (wasSettings) go(screen.name, screen.arg);
    },
    'quit': quit,
    'leave': function () { var b = play ? play.back : { name: 'home' }; go(b.name, b.arg); },
    'speak': function () { if (play) speakTask(play.cur); },
    'demo': function () { if (board && play && !play.done) board.demo(); },
    'clear': function () { if (board && play && !play.done) { board.clear(); say('擦干净了，再写一次'); } },
    'check': checkWrite,
    'again': function () { if (play) loadTask(); },
    'next': nextTask,
    'toggle-input': function () {
      var m = S().set.input, penOnly = m === 'pen' || (m === 'auto' && penSeen);
      Store.setOpt('input', penOnly ? 'any' : 'pen');
      if (board && board.task) board.task.input = S().set.input;
      inputChip();
    },
    'pick-tab': function (t) { pick.tab = t.dataset.id; renderPick(); },
    'pick-mode': function (t) { pick.mode = t.dataset.id; renderPick(); },
    'pick-char': function (t) { startFree(t.dataset.ch, pick.mode); },
    'pick-text': function (t) { startFreeText(t.dataset.text, pick.mode); },
    'practice-text': function (t) { startFreeText(t.dataset.text, Store.textStage(t.dataset.text) ? 'write' : 'trace'); },
    'practice': function (t) { startFree(t.dataset.ch, t.dataset.id); },
    'char': function (t) { charInfo(t.dataset.ch); },
    'day': function (t) {
      var d = Store.lastDays(7)[+t.dataset.i];
      $('#dayNote').textContent = dayNote(d);
      var all = app.querySelectorAll('.bar-col');
      for (var i = 0; i < all.length; i++) all[i].classList.toggle('sel', all[i] === t);
    },
    'weak': function () {
      var tasks = [];
      Store.weakChars(6).forEach(function (x) { tasks.push({ ch: x.ch, mode: 'trace' }, { ch: x.ch, mode: 'write' }); });
      if (tasks.length) startSession({ kind: 'weak', tasks: tasks, back: { name: 'progress' } });
    },
    'shop-item': function (t) { shopTap(t.dataset.type, t.dataset.id); },
    'set': function (t) {
      var o = OPTS.filter(function (x) { return x.k === t.dataset.k; })[0];
      if (o.k === 'font') setFont(o.opts[+t.dataset.i][0]);
      else Store.setOpt(o.k, o.opts[+t.dataset.i][0]);
      renderSettings(false);
    },
    'fonts': renderFonts,
    'font': function (t) {
      var st = Gl.styleOf(t.dataset.id);
      setFont(st.id);
      closeModal();
      go(screen.name, screen.arg);
      toast(icon('check') + '已换成「' + st.name + '」', 'good');
    },
    'reset-ask': function () { renderSettings(true); },
    'reset-yes': function () { Store.reset(); closeModal(); toast('已经清空，从头开始'); go('home'); }
  };
  function onClick(e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || t.disabled) return;
    var fn = acts[t.dataset.act];
    if (!fn) return;
    Sfx.unlock();
    if (!/^(check|demo|clear|speak|day|set)$/.test(t.dataset.act)) Sfx.tap();
    fn(t, e);
  }
  doc.addEventListener('click', onClick);
  doc.addEventListener('pointerdown', function () { Sfx.unlock(); }, { passive: true });
  doc.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modalRoot.hidden && modalRoot.querySelector('[data-act="modal-close"]')) acts['modal-close'](); });
  doc.addEventListener('gesturestart', function (e) { e.preventDefault(); });      // Safari 双指缩放
  root.addEventListener('resize', function () {
    if (screen.name === 'map') layoutMap();
    if (screen.name === 'play') modelText();
  });

  Store.on(function (why) {
    if (why === 'replaced') Gl.setStyle(S().set.font);
    if (why === 'replaced' && screen.name !== 'play') go(screen.name, screen.arg);
    if (why === 'sync') { var l = $('#syncLine'); if (l) l.innerHTML = syncText(); }
  });

  /* 字体：异步加载，加载不到就用系统圆体，不挡首屏 */
  if (!root.WI_NATIVE) try {
    var link = doc.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap';
    doc.head.appendChild(link);
  } catch (e) {}

  /* ---------- 启动 ---------- */
  function start(data) {
    var sc = data && data.screen;
    Gl.setStyle(S().set.font);
    go(sc && sc.name && sc.name !== 'play' ? sc.name : 'home', sc && sc.arg);
    Store.initRemote();
  }
  var hot = root.claude && root.claude.hot;
  try {
    if (hot && hot.snapshot) hot.snapshot(function () { return { screen: screen.name === 'play' && play ? play.back : screen }; });
  } catch (e) {}
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

  root.WI.App = { go: go, startSession: startSession, get board() { return board; }, get play() { return play; } };
})(window);
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
